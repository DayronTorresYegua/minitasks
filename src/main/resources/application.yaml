spring:
  application:
    name: minitasks
  datasource:
    url: jdbc:h2:mem:tasksdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
logging:
  level:
    org.hibernate.SQL: warn
server:
  error:
    whitelabel:
      enabled: true




